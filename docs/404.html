<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Plexo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('/assets/fonts/Archivo-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: swap;
      }
      @font-face {
        font-family: 'Geist';
        src: url('/assets/fonts/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      html {
        color-scheme: dark;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        background: #0a0a0b;
        color: #ededef;
        font-family: 'Geist', system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-family: 'Archivo', 'Helvetica Neue', sans-serif;
        font-stretch: 118%;
        font-weight: 600;
        font-size: clamp(32px, 6vw, 56px);
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      h1 span {
        color: #f36712;
      }
      p {
        margin: 0 0 32px;
        color: #a1a1a8;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: #f36712;
        color: #0a0a0b;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #ff8a3d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span>404</span> Not found</h1>
      <p>This page doesn’t exist.</p>
      <a href="https://getplexo.app/">Back to Plexo</a>
    </main>
  </body>
</html>
