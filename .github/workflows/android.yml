name: Android

on:
  push:
    branches: [main, 'merge/**']
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Optional: set ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      # as repository secrets so every build is signed with the same key (updates install over each
      # other). Without them the APK is signed with the CI runner's debug key.
      - name: Restore signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/plexo.jks"
            {
              echo "PLEXO_KEYSTORE=$RUNNER_TEMP/plexo.jks"
              echo "PLEXO_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "PLEXO_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "PLEXO_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        run: |
          args=""
          if [ -n "$PLEXO_KEYSTORE" ]; then
            args="-PPLEXO_KEYSTORE=$PLEXO_KEYSTORE -PPLEXO_KEYSTORE_PASSWORD=$PLEXO_KEYSTORE_PASSWORD -PPLEXO_KEY_ALIAS=$PLEXO_KEY_ALIAS -PPLEXO_KEY_PASSWORD=$PLEXO_KEY_PASSWORD"
          fi
          gradle assembleRelease --no-daemon --stacktrace $args

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk plexo-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: plexo-android
          path: plexo-android.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: plexo-android.apk
          prerelease: true
