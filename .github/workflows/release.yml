name: Release

# Pushing a version tag (git tag v1.0.0-rc.15 && git push origin v1.0.0-rc.15) builds every OS
# and leaves a draft GitHub Release. Apps only see it once the draft is published.
#
# Run by hand (gh workflow run release.yml --ref <branch>) it's a dry run: the same builds, signed
# the same way, and no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tag names the version the build gets; a mismatch would ship one version as another. The
      # changelog entry becomes the release notes. Both are checked before the long build.
      - name: Check the tag matches package.json and has a changelog entry
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" --changelog > /dev/null

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      # Without the certificate secrets the Mac build is unsigned, and can't update itself; without
      # the API key ones it's signed but not notarized. electron-builder's own CSC_LINK import, as
      # documented; it needs 26.16.1+, before which it unlocked its keychain with the wrong password
      # (electron-userland/electron-builder#10101). Exported on the Mac only: Windows would
      # otherwise try to sign with CSC_LINK too.
      - name: Build
        shell: bash
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signed=
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERTIFICATE_P12_BASE64" ]; then
            signed=1
            export CSC_LINK="$MAC_CERTIFICATE_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
          fi
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          fi
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never
          # electron-builder builds unsigned, quietly, when it finds no identity; such a build could
          # never install an update over a signed one.
          if [ -n "$signed" ]; then
            for app in dist/mac/Plexo.app dist/mac-arm64/Plexo.app; do
              codesign --verify --deep --strict "$app"
              codesign -dv "$app" 2>&1 | grep "^Authority=Developer ID Application" > /dev/null
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          node scripts/release-notes.mjs "$TAG" --files > "$RUNNER_TEMP/files.txt"
          # Not --prerelease, even for an rc: the app updates to the release GitHub marks Latest,
          # and a pre-release never is (see src/main/updater.ts).
          xargs -d '\n' gh release create "$TAG" --draft --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" < "$RUNNER_TEMP/files.txt"
