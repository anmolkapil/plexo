name: Publish plexo-cli to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-asyncio
          pip install -e "packages/plexo-cli[video,test]"

      - name: Run Test Suite
        run: |
          pytest packages/plexo-cli -v

      - name: Build sdist and wheel
        run: |
          python -m build packages/plexo-cli

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: packages/plexo-cli/dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Enables PyPI Trusted Publishing via OIDC
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
