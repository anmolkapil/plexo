[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plexo-cli"
version = "0.2.1"
description = "Multi-network bandwidth bonding download engine & CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Jagjot Singh", email = "gotogether@gmail.com" },
]
keywords = [
    "download-accelerator",
    "network-bonding",
    "bandwidth-aggregation",
    "multi-interface",
    "torrent",
    "proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "urllib3>=2.0.0,<3.0.0",
    "rich>=13.7.0,<15.0.0",
    "click>=8.1.0,<9.0.0",
    "psutil>=5.9.0,<7.0.0",
]

[project.optional-dependencies]
video = [
    "yt-dlp>=2024.7.0",
    "imageio-ffmpeg>=0.5.0,<1.0.0",
    "curl_cffi>=0.7.0,<1.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pip-audit>=2.7.0",
]

[project.urls]
Homepage = "https://getplexo.app"
Repository = "https://github.com/Jagjotkarhu/plexo"
Issues = "https://github.com/anmolkapil/plexo/issues"
Changelog = "https://github.com/Jagjotkarhu/plexo/blob/main/CHANGELOG.md"

[project.scripts]
plexo = "plexo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plexo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
